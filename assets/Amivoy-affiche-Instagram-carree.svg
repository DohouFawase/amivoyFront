<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">Amivoy — affiche Instagram carrée</title>
  <desc id="desc">Une affiche colorée et ludique pour Amivoy, l’application qui aide les amis à organiser sorties et voyages.</desc>
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#17392C" opacity=".1"/></pattern>
    <filter id="drop" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#17392C" flood-opacity=".19"/></filter>
    <clipPath id="photo"><rect x="593" y="361" width="331" height="342" rx="18"/></clipPath>
  </defs>
  <rect width="1080" height="1080" fill="#F7F1E4"/>
  <rect width="1080" height="1080" fill="url(#grain)"/>
  <path d="M0 0h1080v23H0z" fill="#F15E43"/>

  <!-- Top identity -->
  <g transform="translate(62 60)">
    <circle cx="22" cy="22" r="22" fill="#17392C"/>
    <path d="M11 24c7-7 15-7 22 0M15 30c5-5 10-5 15 0" fill="none" stroke="#F8CF3A" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="22.5" cy="35" r="2.6" fill="#F8CF3A"/>
    <text x="59" y="31" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" letter-spacing="-1">amivoy</text>
  </g>
  <text x="1018" y="88" text-anchor="end" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="3">LES PLANS PRENNENT VIE</text>
  <path d="M62 121h956" stroke="#17392C" stroke-width="1.5" opacity=".2"/>

  <!-- Big headline -->
  <text x="60" y="233" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="105" font-weight="900" letter-spacing="-8">On bouge</text>
  <g transform="rotate(-3 360 303)">
    <rect x="57" y="264" width="410" height="85" rx="11" fill="#F8CF3A"/>
    <text x="76" y="330" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="-5">ensemble.</text>
  </g>
  <text x="66" y="394" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500">Trouve l’idée. Réunis ta bande. Vis le moment.</text>

  <!-- Sunburst and playful landscape -->
  <circle cx="764" cy="529" r="205" fill="#F15E43"/>
  <circle cx="764" cy="529" r="176" fill="none" stroke="#F8CF3A" stroke-width="2" stroke-dasharray="2 11"/>
  <path d="M564 612c37-15 73-14 113 0 51 18 98 12 142-4 48-17 95-15 147 3v92H564z" fill="#547C5A"/>
  <path d="M564 649c58-19 100-9 145 4 53 16 96 7 139-6 48-14 81-10 118 2v54H564z" fill="#244B37"/>
  <circle cx="830" cy="477" r="51" fill="#F8CF3A"/>
  <path d="M624 597l86-127 78 113 49-67 102 104" fill="#F7F1E4" opacity=".88"/>
  <path d="M709 470l26 39h-53zM788 516l22 34h-44z" fill="#F15E43"/>
  <!-- winding route -->
  <path d="M612 676c69-60 108 11 161-44s79-80 143-47" fill="none" stroke="#F8CF3A" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 15"/>
  <g transform="translate(895 559)"><path d="M28 0C12.5 0 0 12.5 0 28c0 21 28 51 28 51s28-30 28-51C56 12.5 43.5 0 28 0zm0 37a9 9 0 1 1 0-18 9 9 0 0 1 0 18z" fill="#F8CF3A"/></g>

  <!-- Floating event ticket -->
  <g filter="url(#drop)" transform="rotate(-8 275 560)">
    <path d="M85 459h377v195c-17 0-29 13-29 29s12 29 29 29v25H85v-25c17 0 29-13 29-29s-12-29-29-29z" fill="#FFFDF7"/>
    <path d="M403 459v196" stroke="#17392C" stroke-width="2" stroke-dasharray="7 9" opacity=".28"/>
    <text x="117" y="501" fill="#F15E43" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="2">SAMEDI · 16 H</text>
    <text x="117" y="549" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900" letter-spacing="-1">Pique-nique</text>
    <text x="117" y="585" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">au bord de l’eau</text>
    <text x="117" y="620" fill="#647266" font-family="Arial,Helvetica,sans-serif" font-size="14">Cotonou · 4 amis déjà partants</text>
    <circle cx="434" cy="510" r="4" fill="#F7F1E4"/><circle cx="434" cy="624" r="4" fill="#F7F1E4"/>
    <circle cx="429" cy="562" r="29" fill="#F8CF3A"/>
    <path d="M415 562h28M429 548v28" stroke="#17392C" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Stickers -->
  <g transform="rotate(9 921 318)">
    <rect x="836" y="276" width="170" height="66" rx="33" fill="#17392C"/>
    <text x="921" y="317" text-anchor="middle" fill="#F7F1E4" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="1">C’EST PARTI !</text>
  </g>
  <g transform="rotate(-12 533 748)">
    <rect x="472" y="725" width="139" height="51" rx="25" fill="#F8CF3A"/>
    <text x="541" y="758" text-anchor="middle" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800">À PLUSIEURS ✳</text>
  </g>

  <!-- Social proof chips / app promise -->
  <g transform="translate(65 810)">
    <text x="0" y="0" fill="#F15E43" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" letter-spacing="2">UNE APP POUR</text>
    <g font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">
      <rect x="0" y="20" width="143" height="45" rx="22" fill="#17392C"/><text x="71" y="49" text-anchor="middle" fill="#F7F1E4">SORTIR</text>
      <rect x="153" y="20" width="154" height="45" rx="22" fill="#F15E43"/><text x="230" y="49" text-anchor="middle" fill="#fffaf0">VOYAGER</text>
      <rect x="317" y="20" width="204" height="45" rx="22" fill="#F8CF3A"/><text x="419" y="49" text-anchor="middle" fill="#17392C">SE RETROUVER</text>
    </g>
    <text x="0" y="115" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="-.5">Les idées sont meilleures quand elles se partagent.</text>
    <text x="0" y="147" fill="#647266" font-family="Arial,Helvetica,sans-serif" font-size="16">Organisez vos sorties, vos voyages et gardez vos souvenirs au même endroit.</text>
  </g>

  <!-- Footer -->
  <path d="M62 1001h956" stroke="#17392C" stroke-width="1.5" opacity=".2"/>
  <text x="64" y="1040" fill="#17392C" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" letter-spacing="2">TON GROUPE. VOS PLANS. VOS SOUVENIRS.</text>
  <text x="1016" y="1040" text-anchor="end" fill="#F15E43" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900">AMIVOY ↗</text>
</svg>
